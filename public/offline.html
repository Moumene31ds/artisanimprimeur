<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Hors ligne | L'Artisan Imprimeur</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100dvh; display: flex; align-items: center; justify-content: center;
      background: #0f172a; color: #fff; padding: 1.5rem;
    }
    .card {
      max-width: 400px; width: 100%; text-align: center;
      background: #1e293b; border-radius: 2rem; padding: 3rem 2rem;
      border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 25px 60px -15px rgba(0,0,0,0.3);
    }
    .icon { width: 80px; height: 80px; margin: 0 auto 1.5rem; border-radius: 50%; background: #334155; display: flex; align-items: center; justify-content: center; }
    .icon svg { width: 40px; height: 40px; fill: #818cf8; }
    h1 { font-size: 1.5rem; font-weight: 900; margin-bottom: 0.75rem; }
    p { color: #94a3b8; line-height: 1.6; font-size: 0.9rem; margin-bottom: 2rem; }
    .btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: #6366f1; color: #fff; border: none; padding: 0.85rem 2rem;
      border-radius: 999px; font-weight: 700; font-size: 0.9rem; cursor: pointer;
      transition: background 0.2s; text-decoration: none;
    }
    .btn:hover { background: #4f46e5; }
    .btn:active { transform: scale(0.97); }
    .contact { margin-top: 1.5rem; font-size: 0.8rem; color: #64748b; }
    .contact a { color: #a5b4fc; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8 0-1.85.63-3.55 1.69-4.9L16.9 18.31C15.55 19.37 13.85 20 12 20zm6.31-3.1L7.1 5.69C8.45 4.63 10.15 4 12 4c4.42 0 8 3.58 8 8 0 1.85-.63 3.55-1.69 4.9z"/></svg>
    </div>
    <h1>Vous êtes hors ligne</h1>
    <p>Vérifiez votre connexion Internet et réessayez. Les pages déjà visitées restent accessibles hors ligne.</p>
    <button class="btn" onclick="window.location.reload()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
      Réessayer
    </button>
    <div class="contact">
      Appelez-nous : <a href="tel:+213549179000">+213 549 17 90 00</a>
    </div>
  </div>
</body>
</html>
